[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
known_first_party = api, foodgram, recipes, users
no_lines_before = LOCALFOLDER
multi_line_output = 3
include_trailing_comma = true
split_on_trailing_comma = true
order_by_type = false